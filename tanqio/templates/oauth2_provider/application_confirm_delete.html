{% extends 'tanqio/base.html' %}
{% block title %}Delete Application{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto mt-10 bg-white/70 backdrop-blur rounded p-6 shadow">
  <h1 class="text-xl font-semibold mb-4">Delete Application</h1>
  <p class="mb-4">Are you sure you want to delete <strong>{{ application.name }}</strong>? This cannot be undone.</p>
  <form method="post" class="flex gap-3">
    {% csrf_token %}
    <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded">Delete</button>
    <a href="{% url 'oauth2_provider:list' %}" class="bg-gray-300 hover:bg-gray-400 text-gray-900 px-4 py-2 rounded">Cancel</a>
  </form>
</div>
{% endblock %}

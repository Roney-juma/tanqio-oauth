alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
# NOTE: Ensure no tab characters exist in this file (DigitalOcean spec parser forbids tabs). All indentation uses two spaces.

envs:
  - key: SECRET_KEY
    scope: RUN_AND_BUILD_TIME
    value: changeme-super-secret
  - key: DEBUG
    scope: RUN_AND_BUILD_TIME
    value: "False"
  - key: ALLOWED_HOSTS
    scope: RUN_AND_BUILD_TIME
    value: yourdomain.com
  - key: POSTGRES_DB
    scope: RUN_AND_BUILD_TIME
    value: oauth
  - key: POSTGRES_USER
    scope: RUN_AND_BUILD_TIME
    value: oauth
  - key: POSTGRES_PASSWORD
    scope: RUN_AND_BUILD_TIME
    value: strongpassword
  - key: POSTGRES_HOST
    scope: RUN_AND_BUILD_TIME
    value: db
  - key: POSTGRES_PORT
    scope: RUN_AND_BUILD_TIME
    alerts:
      - rule: DEPLOYMENT_FAILED

    # Minimal sanitized DigitalOcean App Spec (spaces only, no tabs)
    name: tanqio-oauth
    region: blr

    services:
      - name: tanqio-oauth2
        environment_slug: python
        github:
          repo: Roney-juma/tanqio-oauth
          branch: deploy-branch
          deploy_on_push: true
        run_command: gunicorn oauth.wsgi:application --bind 0.0.0.0:$PORT
        build_command: pip install -r requirements.txt
        instance_size_slug: apps-s-1vcpu-1gb
        instance_count: 1
        envs:
          - key: SECRET_KEY
            scope: RUN_AND_BUILD_TIME
            value: changeme-super-secret
          - key: DEBUG
            scope: RUN_AND_BUILD_TIME
            value: "False"
          - key: ALLOWED_HOSTS
            scope: RUN_AND_BUILD_TIME
            value: yourdomain.com
          - key: POSTGRES_DB
            scope: RUN_AND_BUILD_TIME
            value: oauth
          - key: POSTGRES_USER
            scope: RUN_AND_BUILD_TIME
            value: oauth
          - key: POSTGRES_PASSWORD
            scope: RUN_AND_BUILD_TIME
            value: strongpassword
          - key: POSTGRES_HOST
            scope: RUN_AND_BUILD_TIME
            value: db
          - key: POSTGRES_PORT
            scope: RUN_AND_BUILD_TIME
            value: "5432"

    # Remove or extend envs above as needed (social auth keys etc.)

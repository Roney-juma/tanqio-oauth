# Docker Compose for Django + Postgres
# Notes:
# - For local dev you can uncomment the code mount to enable live reload (requires runserver)
# - In production keep images immutable; rely on collected static files volume.

services:
  db:
    image: postgres:15-alpine
    container_name: oauth_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: oauth
      POSTGRES_USER: oauth
      POSTGRES_PASSWORD: oauth
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  django:
    build: .
    container_name: django_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
      SECRET_KEY: "change-me-in-prod"
      POSTGRES_DB: oauth
      POSTGRES_USER: oauth
      POSTGRES_PASSWORD: oauth
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # Optional external resource server envs (unset by default)
      # RESOURCE_SERVER_INTROSPECTION_URL: ""
      # RESOURCE_SERVER_CLIENT_ID: ""
      # RESOURCE_SERVER_CLIENT_SECRET: ""
      # RESOURCE_SERVER_REVOCATION_URL: ""
    volumes:
      - static_data:/app/staticfiles
      # Dev only: mount source for hot reload (switch command to runserver)
      # - .:/app
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:8000/api/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Default command already set in Dockerfile (gunicorn). For dev you can override:
    # command: python manage.py runserver 0.0.0.0:8000

volumes:
  db_data:
  static_data:
